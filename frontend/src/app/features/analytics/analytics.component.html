<section class="analytics-shell" aria-label="KPI Analytics Dashboard">
  <header class="page-header">
    <h1>Analytics</h1>
    <app-analytics-filter-bar
      [initialFilters]="initialFilters"
      [availableUnits]="availableUnits"
      (filterChange)="onFilterChange($event)"
    />
  </header>

  <ng-container *ngIf="kpiData$ | async as kpiData; else loading">
    <!-- KPI Tiles -->
    <div class="kpi-grid" aria-label="Key performance indicator summary">
      <ng-container *ngIf="kpiTiles$ | async as tiles">
        <article *ngFor="let tile of tiles" class="kpi-card">
          <div class="kpi-label">{{ tile.label }}</div>
          <div class="kpi-value">{{ tile.value }}</div>
          <div class="kpi-trend" [class]="tile.trendClass">{{ tile.trend }}</div>
        </article>
      </ng-container>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
      <app-discharge-volume-chart [data]="kpiData.data" class="chart-card" />
      <app-risk-distribution-chart [riskDistribution]="riskDistribution$ | async" class="chart-card" />
    </div>

    <!-- High-risk table -->
    <app-high-risk-table [response]="highRiskEncounters$ | async" />

    <!-- Export -->
    <div class="export-row" aria-label="Export KPI report">
      <button
        class="btn-export"
        [disabled]="isExportingCsv"
        (click)="onExportCsv()"
        aria-label="Export KPI data as CSV file"
      >
        <span *ngIf="!isExportingCsv">Export CSV</span>
        <span *ngIf="isExportingCsv">Exporting...</span>
      </button>
      <button
        class="btn-export"
        [disabled]="isExportingPdf"
        (click)="onExportPdf()"
        aria-label="Export KPI report as PDF document"
      >
        <span *ngIf="!isExportingPdf">Export PDF</span>
        <span *ngIf="isExportingPdf">Generating PDF...</span>
      </button>
      <div *ngIf="exportError" class="export-error" role="alert" aria-live="assertive">
        {{ exportError }}
      </div>
    </div>
  </ng-container>

  <ng-template #loading>
    <div role="status" aria-live="polite" class="loading-state">Loading KPI data…</div>
  </ng-template>
</section>
