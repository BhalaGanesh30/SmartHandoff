<form
  [formGroup]="filterForm"
  (ngSubmit)="applyFilter()"
  role="search"
  aria-label="KPI dashboard filter controls"
  class="filter-bar"
>
  <select
    formControlName="dateRangePreset"
    class="filter-select"
    aria-label="Preset date range"
    (change)="onPresetChange()"
  >
    <option value="30">Last 30 days</option>
    <option value="7">Last 7 days</option>
    <option value="90">Last 90 days</option>
    <option value="custom">Custom range</option>
  </select>

  @if (showCustomDateRange) {
    <div class="custom-date-range" formGroupName="dateRange">
      <input type="date" formControlName="start" aria-label="Start date" />
      <input type="date" formControlName="end" aria-label="End date" />
    </div>
  }

  <select formControlName="unit" class="filter-select" aria-label="Filter by hospital unit">
    <option [value]="null">All Units</option>
    @for (unit of availableUnits; track unit) {
      <option [value]="unit">{{ unit }}</option>
    }
  </select>
</form>
