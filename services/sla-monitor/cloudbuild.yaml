# Per-service Cloud Build pipeline — sla-monitor
# Generated from .cloudbuild/cloudbuild-template.yaml
# All other substitutions (_ENVIRONMENT, _REGION, _PROJECT_ID, _ORG_ID) are
# injected at runtime by the google_cloudbuild_trigger Terraform resource.

substitutions:
  _SERVICE_NAME: 'sla-monitor'
  _ENVIRONMENT: 'dev'
  _REGION: 'us-central1'
  _PROJECT_ID: 'REPLACE_WITH_TRIGGER_SUBSTITUTION'
  _ORG_ID: 'REPLACE_WITH_TRIGGER_SUBSTITUTION'

steps:
  - name: 'python:3.11-slim'
    id: 'lint-python'
    entrypoint: bash
    args:
      - '-c'
      - |
        if [ -f requirements.txt ] || [ -d app ]; then
          pip install flake8 --quiet
          flake8 app/ --max-line-length=120 --statistics
        else
          echo "No Python source — skipping Python lint"
        fi
    dir: 'services/${_SERVICE_NAME}'

  - name: 'zricethezav/gitleaks:v8.18.4'
    id: 'source-secret-scan'
    entrypoint: 'gitleaks'
    args:
      - 'detect'
      - '--source=/workspace'
      - '--config=/workspace/.gitleaks.toml'
      - '--redact'
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/services/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/services/${_SERVICE_NAME}:latest'
      - '-f'
      - 'services/${_SERVICE_NAME}/Dockerfile'
      - 'services/${_SERVICE_NAME}'
    waitFor:
      - 'lint-python'
      - 'source-secret-scan'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/services/${_SERVICE_NAME}'
    waitFor:
      - 'build-image'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/services/${_SERVICE_NAME}:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=${_SERVICE_NAME}@${_PROJECT_ID}.iam.gserviceaccount.com \
          --set-env-vars="DATABASE_WRITE_URL=$$DATABASE_WRITE_URL,DATABASE_READ_URL=$$DATABASE_READ_URL,GCP_PROJECT_ID=${_PROJECT_ID}" \
          --max-instances=3 \
          --memory=512Mi \
          --cpu=1
    secretEnv:
      - 'DATABASE_WRITE_URL'
      - 'DATABASE_READ_URL'
    waitFor:
      - 'push-image'

availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/database-write-url/versions/latest
      env: 'DATABASE_WRITE_URL'
    - versionName: projects/${_PROJECT_ID}/secrets/database-read-url/versions/latest
      env: 'DATABASE_READ_URL'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
