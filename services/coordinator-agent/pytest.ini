[pytest]
# Pytest configuration for coordinator-agent

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Default markers
markers =
    performance: Performance tests requiring a real database
    unit: Fast isolated unit tests (no external dependencies)
    integration: Integration tests with external dependencies

# Output and verbosity
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Coverage options (when running with --cov)
[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
