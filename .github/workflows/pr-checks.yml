name: PR Checks - Unit Tests & Linting

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/pr-checks.yml'

env:
  PYTHON_VERSION: '3.11'

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run linting (ruff)
        run: |
          cd backend
          ruff check app/ agents/ tests/
      
      - name: Run type checking (mypy)
        run: |
          cd backend
          mypy app/ agents/
      
      - name: Run unit tests (exclude performance)
        run: |
          cd backend
          pytest tests/unit/ tests/agents/ \
            -m "not performance" \
            -v \
            --cov=app \
            --cov=agents \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            --maxfail=5
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true
      
      - name: Comment PR with coverage
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

  phi-audit-tests:
    name: PHI Audit Tests (Security Gate)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run PHI audit tests
        run: |
          cd backend
          pytest tests/security/test_phi_audit_prompt.py \
            -v \
            --tb=short \
            -x
        
      - name: Fail if PHI leak detected
        if: failure()
        run: |
          echo "❌ PHI AUDIT FAILURE: Prohibited PII detected in prompt template"
          echo "This is a HIPAA compliance violation and must be fixed before merge."
          exit 1

  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run integration tests
        run: |
          cd backend
          pytest tests/integration/ \
            -v \
            --tb=short \
            --maxfail=3
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/test-results/
          retention-days: 7

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run linting
        run: |
          cd frontend
          npm run lint
      
      - name: Run unit tests
        run: |
          cd frontend
          npm run test:ci
      
      - name: Build production bundle
        run: |
          cd frontend
          npm run build

  summary:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, phi-audit-tests, integration-tests, frontend-tests]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.phi-audit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All PR checks passed"
